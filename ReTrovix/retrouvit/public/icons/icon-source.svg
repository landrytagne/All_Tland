<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- Magnifying glass -->
  <circle cx="440" cy="420" r="180" fill="none" stroke="white" stroke-width="50"/>
  <line x1="570" y1="550" x2="720" y2="700" stroke="white" stroke-width="55" stroke-linecap="round"/>
  <!-- Pin/location dot inside magnifier -->
  <circle cx="440" cy="400" r="50" fill="white"/>
  <!-- Subtle sparkle -->
  <circle cx="700" cy="300" r="20" fill="white" opacity="0.6"/>
  <circle cx="350" cy="700" r="15" fill="white" opacity="0.4"/>
</svg>
