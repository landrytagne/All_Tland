spring:
  application:
    name: retrouvit-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/retrouvit_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Email (SMTP)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:ZXlKcGRXazZhV3hzWDJzMFpXVnpZMkYwYVc5dVgybHpYMjFwZEY5aGJXVT0K}
  expiration: ${JWT_EXPIRATION:3600000}           # 1 hour (access token)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 days (refresh token)

# File Upload Configuration
upload:
  dir: ${UPLOAD_DIR:./uploads}
  max-size: ${UPLOAD_MAX_SIZE:10485760}  # 10MB

# App URL for email links
app:
  url: ${APP_URL:http://localhost:3000}
  name: ${APP_NAME:RetrouvIt}

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Sentry Error Tracking (optional — leave blank to disable)
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}

---
# ═══ Dev Profile (MailHog) ═══════════════════════════════════════
spring:
  config:
    activate:
      on-profile: dev
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
