# ═══════════════════════════════════════════════════════════════
# RetrouvIt — Docker Compose
# Usage: docker compose up -d --build
# ═══════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL Database ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: retrouvit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: retrouvit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retrouvit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ────────────────────────────────────────────
  api:
    build:
      context: ./retrouvit-api
      dockerfile: Dockerfile
    container_name: retrouvit-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/retrouvit_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-ZXlKcGRXazZhV3hzWDJzMFpXVnpZMkYwYVc5dVgybHpYMjFwZEY5aGJXVT0K}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-2592000000}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_NAME: RetrouvIt
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Frontend ───────────────────────────────────────────────
  web:
    build:
      context: ./retrouvit
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: retrouvit-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - api

  # ─── MailHog (dev — email testing) ─────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: retrouvit-mail
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI: http://localhost:8025

volumes:
  pgdata:
  uploads:
