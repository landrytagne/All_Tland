<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Accueil</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Anton&family=Dancing+Script:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=Murecho:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&family=Press+Start+2P&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900&family=Rubik+Wet+Paint&family=Smooch+Sans:wght@100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
        <script defer src="https://cdn.tailwindcss.com"></script>

    <body>
        <header>
            <div>
                <img src="images/Image collée.png">
                <div>
                    <h1>Delicacy</h1>
                    <p>Organic</p>
                </div>
            </div>
            <div class="center">
                <h3>Delivery to</h3>
                <i class="bx bx-location-plus"></i>
                <p>Khulna, Bangladesh...</p>
                <input type="text" placeholder="What ares you looking for?">
                <i class="bx bx-search"></i>
            </div>
            <div class="right">
                <div>
                    <i class="bx bx-heart"></i>
                    <i class="bx bx-cart-alt"></i>
                    <div>
                        <h3>
                            My Cart
                            <i class="bx bx-chevron-down"></i>
                        </h3>
                        <p>$225.00</p>
                    </div>
                    <div>
                        <img src="images/Image collée (2).png">
                        <h3>Abdus Rahman</h3>
                        <i class="bx bx-chevron-down"></i>
                    </div>
                </div>
            </div>
            <div>
                <i class="bx bx-headphone"></i>
                <h3>(123) 8800-555</h3>
                <div>
                    <i class="bx bxs-gift"></i>
                    <h3>Gift cards</h3>
                </div>
            </div>
        </header>
    </body>
